volumes:
  mongodb_data: 
    driver: local

services:
  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      ROCKETAPP_MONGO__URI: mongodb://mongodb:27017
      ROCKETAPP_MONGO__DATABASE: rocketappdb
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    # TODO healthcheck
  mongodb:
    image: mongo:6.0.5
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "0.0.0.0:27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
