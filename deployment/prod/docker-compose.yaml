volumes:
  mongodb_data:
    driver: local

services:
  frontend:
    build:
      context: ../../frontend
      args:
        BACKEND_URL: "http://127.0.0.1:${BACKEND_PORT}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://frontend:80" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      ROCKETAPP_MONGO__URI: mongodb://mongodb:27017?replicaSet=rs0
      ROCKETAPP_MONGO__DATABASE: rocketappdb
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://backend:8000/_health", "-O", "/dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot контейнер для инициализации MongoDB в режиме replica set
  mongodb-bootstrap:
    image: mongo:8
    restart: no
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../../mongodb/bootstrap:/bootstrap:ro
    entrypoint: [ "/bin/bash" ]
    command: [ "/bootstrap/init.sh" ]

