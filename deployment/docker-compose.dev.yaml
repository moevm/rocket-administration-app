volumes:
  mongodb_data: { driver: local }

services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    restart: always
    environment:
      MONGO_URL: "mongodb://mongodb:27017/rocketchat"
      ROOT_URL: http://localhost:3000
      PORT: 3000
      DEPLOY_METHOD: docker
    depends_on:
      - mongodb
    expose:
      - 3000
    ports:
      - "0.0.0.0:3000:3000"

  mongodb:
    image: mongo:6.0.5
    restart: always
    volumes:
      - mongodb_data:/data/db  # Change the volume path to the default MongoDB data directory
    ports: 
      - "0.0.0.0:27017:27017"
