volumes:
  mongodb_data:
    driver: local
  openldap_data:
  openldap_config:

services:
  rocketchat:
    image: rocket.chat:8.4
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://mongodb:27017/rocketchat"
      ROOT_URL: http://127.0.0.1
      PORT: 3000
      DEPLOY_METHOD: docker
      ADMIN_USERNAME: rocketadmin
      ADMIN_PASS: admin
      ADMIN_EMAIL: admin@example.com
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/wget --no-verbose --tries=1 -S --spider 127.0.0.1:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8.3
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: [ "--replSet", "rs0", "--bind_ip_all" ]

  mongodb-bootstrap:
    image: mongo:8.3
    restart: no
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../../mongodb/bootstrap:/bootstrap:ro
    entrypoint: [ "/bin/bash" ]
    command: [ "/bootstrap/init.sh" ]

  openldap:
    image: nfrastack/openldap:2.6-8.0.2
    restart: unless-stopped
    ports:
      - "0.0.0.0:8389:389"
    environment:
      - TZ=Europe/Moscow
      - DOMAIN=moevm.info
      - ADMIN_PASS=admin
      - CONFIG_PASS=config
      - BASE_DN=dc=moevm,dc=info
      - REMOVE_CONFIG_AFTER_SETUP=FALSE
      - ENABLE_BACKUP=FALSE
      - ENABLE_PPOLICY=FALSE
      - ENABLE_TLS=FALSE
      - ENABLE_REPLICATION=FALSE
    volumes:
      - openldap_data:/data/db
      - openldap_config:/data/config
    healthcheck:
      test: [ "CMD", "ldapwhoami", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=moevm,dc=info", "-w", "admin" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  openldap-bootstrap:
    image: nfrastack/openldap:2.6-8.0.2
    restart: no
    environment:
      - TZ=Europe/Moscow
      - LDAPNOINIT=1
      - ADMIN_PASS=admin
      - CONFIG_PASS=config
      - BASE_DN=dc=moevm,dc=info
    depends_on:
      openldap:
        condition: service_healthy
    volumes:
      - ../../openldap/bootstrap:/bootstrap:ro
    entrypoint: [ "/bin/bash" ]
    command: [ "/bootstrap/init.sh" ]

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      ENV_FOR_DYNACONF: docker
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "http://backend:8000/_health", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ../../backend:/app
      - /app/.venv
    profiles:
      - back
      - full

  frontend:
    build:
      context: ../../frontend
      args:
        BACKEND_URL: "http://127.0.0.1:8000"
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://frontend:80"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - front
      - full