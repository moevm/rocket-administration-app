[project]
name = "rocketapp"
version = "0.1.0"
description = ""
authors = [
    { name = "Max", email = "swifstail@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.8,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "rocketchat-api (>=1.35.0,<2.0.0)",
    "pymongo (>=4.11.1,<5.0.0)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "aiosmtplib (>=4.0.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-rocketapp = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "rocketapp.main:start"